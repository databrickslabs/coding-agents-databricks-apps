command:
  - gunicorn
  - app:app
env:
  - name: HOME
    value: /app/python/source_code
  - name: ANTHROPIC_MODEL
    value: databricks-claude-opus-4-7
  - name: GEMINI_MODEL
    value: databricks-gemini-2-5-pro
  # Must be a *-codex model served via the Responses API — the Codex harness
  # (and CLI) speaks wire_api="responses", which only the -codex endpoints
  # support. A general chat-completions model (e.g. databricks-gpt-5-5) 400s on
  # /responses. See setup_codex.py base_url handling.
  - name: CODEX_MODEL
    value: databricks-gpt-5-3-codex
  - name: HERMES_MODEL
    value: databricks-claude-opus-4-6
  - name: HERMES_FALLBACK_MODEL
    value: databricks-claude-opus-4-6
  # Set ENABLE_HERMES=false to skip Hermes Agent install. Other CLIs are unaffected.
  - name: ENABLE_HERMES
    value: "true"
  - name: CLAUDE_CODE_DISABLE_AUTO_MEMORY
    value: 0
  # Set CLAUDE_CODE_OTEL_ENABLED=true to send Claude Code OTEL signals to Unity Catalog.
  - name: CLAUDE_CODE_OTEL_ENABLED
    value: "true"
  - name: CLAUDE_CODE_OTEL_CATALOG_SCHEMA
    value: davidokeeffe_standard_demo_catalog.default
  - name: MAX_CONCURRENT_SESSIONS
    value: "5"
  # Register this app as a persistent Omnigent host on boot. With the URL set,
  # initialize_app() -> start_host() dials the server as the app SP, so the
  # deployed app self-registers as an always-on host on every restart/redeploy.
  - name: OMNIGENTS_SERVER_URL
    value: "https://omnigent-daveok-335310294452632.aws.databricksapps.com"
  # Install source for the omnigent host CLI (downloaded from this UC Volume
  # using the app SP's READ_VOLUME grant).
  - name: OMNIGENTS_WHEEL_SPEC
    value: "/Volumes/lakemeter_catalog/daveok_omnigent/artifacts/wheels"
