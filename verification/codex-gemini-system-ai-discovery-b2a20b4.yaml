contract:
  intended_outcomes:
    - "Keep Codex and Gemini enabled by default in all supported manifests."
    - "Use system.ai model-service request names as portable defaults for Claude, Pi, Codex, and Gemini."
    - "Have Codex and Gemini setup discover live system.ai model services and select a served provider-compatible model when the request is unavailable."
    - "Use workspace-origin AI Gateway routes matching ucode: /ai-gateway/codex/v1 and /ai-gateway/gemini/v1beta."
    - "Use broker-aware, refresh-safe token resolution so SP/no-PAT boot configures and continues to serve both agents."
  observable_checks:
    - "All supported YAML manifests parse and contain system.ai defaults and quoted true toggles."
    - "Setup tests prove discovery remapping, route selection, broker-only auth, and fresh-token wrapper/helper behavior."
    - "Malformed model-service payloads do not crash discovery; foundation metadata is fetched once per catalog build."
    - "Focused tests, lint, compile, and the non-Docker suite pass subject to recorded baseline failures."
  non_goals:
    - "No gateway endpoint provisioning or live Databricks deployment."
    - "No Hermes routing redesign; Hermes remains on its existing proxy/model contract."
  human_reserved_decisions:
    - "Whether protected-branch policy permits direct push or requires a PR."
