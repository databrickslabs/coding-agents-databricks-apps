finding_reproductions:
  - finding: "Codex/Gemini setup persisted broker-issued short-lived tokens"
    disposition: "fixed"
    evidence: "setup_codex.py configures a ucode-style auth command invoking token_helper per request/TTL; setup_gemini.py installs a launcher wrapper invoking the helper before every process. Tests verify no static bearer is written and execute both helper paths with a temporary token source."
  - finding: "Model-services payload with model_services=null could crash discovery"
    disposition: "fixed"
    evidence: "gateway_models.py now treats a non-list service collection as an empty/partial result; focused tests cover the malformed payload."
  - finding: "Foundation metadata is fetched twice per catalog build"
    disposition: "fixed"
    evidence: "discover_oss_specs accepts the already-fetched metadata snapshot; catalog test asserts one metadata read."
  - finding: "Auth documentation described Codex as proxy-routed and omitted Gemini"
    disposition: "fixed"
    evidence: "docs/auth-and-identity.md now documents Codex auth command and Gemini launcher wrapper."
  - finding: "Direct serving-endpoint route comments were stale"
    disposition: "fixed"
    evidence: "setup_gemini.py, app.yaml.template, and deployment docs now describe workspace-origin gateway routes and system.ai discovery."
  - finding: "Known-family model fallback when capability metadata is unavailable"
    disposition: "accepted residual for ucode parity"
    evidence: "gateway_models.py intentionally preserves known system.ai family IDs when capability metadata is absent, matching ucode's graceful fallback; explicit incompatible metadata is filtered."
