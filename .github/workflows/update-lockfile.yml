name: Update Lockfile

on:
  push:
    branches: [main]
    paths:
      - "requirements.txt"

jobs:
  update-lockfile:
    # See the note in test.yml: this repo was never granted
    # databrickslabs-protected-runner-group, so this job never ran — which is
    # why requirements.lock had drifted from requirements.txt. Uses only the
    # repo-scoped GITHUB_TOKEN, no org secrets.
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Regenerate requirements.lock
        run: uv pip compile requirements.txt -o requirements.lock --generate-hashes

      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet requirements.lock; then
            echo "requirements.lock is already up to date, nothing to commit"
          else
            git add requirements.lock
            git commit -m "chore: regenerate requirements.lock after requirements.txt update"
            git push
          fi
